<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los guardianes de los números</title><style>body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#d9f2ff,#f7e7ff);color:#24345a;margin:0;padding:20px}main{max-width:750px;margin:auto;background:white;border-radius:24px;padding:25px;box-shadow:0 8px 28px #8296b355}h1{text-align:center;color:#4839a8}.scene{text-align:center;font-size:55px;min-height:75px}.sub{text-align:center}.stats{display:flex;justify-content:space-between;font-weight:bold;gap:10px}progress{width:100%;height:20px}#question{text-align:center;font-size:25px;font-weight:bold;margin:28px 0}#choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:2px solid #7867d6;border-radius:16px;padding:17px;font-size:22px;font-weight:bold;background:#eae7ff;color:#29215d;cursor:pointer}button:hover{background:#d5ccff}button:disabled{opacity:.5;cursor:default}#feedback{text-align:center;font-weight:bold;min-height:30px}#next{display:block;margin:20px auto;background:#ffe58a}#next[hidden]{display:none}#restart{font-size:15px;padding:10px;display:block;margin:12px auto}.note{text-align:center;font-size:13px}</style></head><body><main><h1>🏰 Los guardianes de los números ⭐</h1><div id="scene" class="scene">🧙‍♂️🌟</div><p class="sub">¡Rescata las 9 estrellas del castillo resolviendo desafíos!</p><div class="stats"><span id="mission"></span><span id="score"></span></div><progress id="progress" max="9" value="0"></progress><div id="question"></div><div id="choices"></div><p id="feedback" role="status" aria-live="polite"></p><button id="next" hidden>Siguiente desafío ➜</button><button id="restart">🔄 Volver a empezar</button><p class="note">Al terminar, explica a tu docente cómo resolviste uno de los desafíos.</p></main><script>const questions=[['Tienes 3 manzanas y recibes 2 más. ¿Cuántas tienes?',5,[4,5,6,7],'🍎🍎🍎 + 🍎🍎'],['Hay 4 mariposas y llegan 3. ¿Cuántas hay?',7,[6,8,7,5],'🦋🦋🦋🦋 + 🦋🦋🦋'],['Hay 6 flores y nacen 2 más. ¿Cuántas hay?',8,[7,9,6,8],'🌼🌼🌼🌼🌼🌼 + 🌼🌼'],['Había 8 globos y se fueron 3. ¿Cuántos quedan?',5,[5,6,4,3],'🎈 8 − 3'],['Tienes 10 caramelos y regalas 4. ¿Cuántos quedan?',6,[7,5,6,8],'🍬 10 − 4'],['Hay 9 pájaros y vuelan 2. ¿Cuántos quedan?',7,[6,7,8,5],'🐦 9 − 2'],['Tienes 7 estrellas y ganas 5. ¿Cuántas tienes?',12,[11,13,12,10],'⭐ 7 + 5'],['En un cofre hay 15 monedas y sacas 5. ¿Cuántas quedan?',10,[9,11,12,10],'🪙 15 − 5'],['Hay 12 libros y llegan 4 más. ¿Cuántos hay?',16,[15,16,14,17],'📚 12 + 4']];let i=0,points=0,errors=0,locked=false;const get=id=>document.getElementById(id);function render(){get('score').textContent='⭐ '+points+' de 9';get('progress').value=i;if(i===9){get('mission').textContent='¡Finalizado!';get('scene').textContent='🏆🎉';get('question').textContent='¡Completaste las 3 misiones!';get('choices').replaceChildren();get('feedback').textContent='Estrellas: '+points+'/9 · Intentos incorrectos: '+errors+'. ¡Buen trabajo!';get('next').hidden=true;return}locked=false;const [q,a,options,scene]=questions[i];get('mission').textContent='Misión '+(Math.floor(i/3)+1)+' de 3 · Reto '+(i+1)+'/9';get('scene').textContent=scene;get('question').textContent=q;get('feedback').textContent='Selecciona la respuesta correcta.';get('next').hidden=true;get('choices').replaceChildren();options.forEach(n=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>{if(locked)return;if(n===a){locked=true;points++;get('score').textContent='⭐ '+points+' de 9';get('progress').value=i+1;get('feedback').textContent='¡Correcto! ⭐ ¡Ganaste una estrella!';get('next').hidden=false;Array.from(get('choices').children).forEach(x=>x.disabled=true)}else{errors++;b.disabled=true;get('feedback').textContent='¡Inténtalo otra vez! Puedes contar con tus dedos.'}};get('choices').appendChild(b)})}get('next').onclick=()=>{i++;render()};get('restart').onclick=()=>{i=0;points=0;errors=0;render()};render();</script></body></html>
